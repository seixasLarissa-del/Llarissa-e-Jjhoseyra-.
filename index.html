<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Lock - Projeto Atacante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>PROJETO BLUE LOCK</h1>
        <p>A busca pelo atacante mais egoísta do mundo</p>
    </header>

        <main>
        <!-- CARD DO RIN -->
        <section class="card">
            <!-- Link de imagem aberto e funcional -->
            <img src="https://zyrosite.com" alt="Capa Blue Lock Volume 6 - Rin Itoshi" class="foto-personagem">
            <h2>Rin Itoshi</h2>
            <p>Arma: Chutes de alta precisão e Triunfo Alheio.</p>
            <button id="btn-rin">Despertar Ego</button>
            <p id="msg-rin" class="escondido"></p>
        </section>

              <!-- CARD DO ISAGI -->
        <section class="card">
            <h2>Isagi Yoichi</h2>
            <p>Arma: Percepção Espacial e Metavision.</p>
            <button id="btn-isagi">Despertar Ego</button>
            <p id="msg-isagi" class="escondido"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
